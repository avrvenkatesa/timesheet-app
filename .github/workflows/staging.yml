# .github/workflows/staging.yml
name: Staging CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # Test job runs on all pushes and PRs
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Frontend Tests (React app in root)
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --coverage --passWithNoTests --ci

      - name: Lint Frontend Code
        run: npm run lint || echo "Linting skipped"

      - name: Build Frontend
        run: npm run build
        env:
          CI: false

      # Backend Tests (server folder)
      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Run Backend Tests
        run: cd server && npm test || echo "Backend tests not yet implemented"

      - name: Lint Backend Code
        run: cd server && npm run lint || echo "Backend linting skipped"

      # Security Audits
      - name: Frontend Security Audit
        run: npm audit --audit-level=moderate || echo "Audit completed with warnings"

      - name: Backend Security Audit
        run: cd server && npm audit --audit-level=moderate || echo "Backend audit completed with warnings"

      # Upload test results
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: ./coverage

  # Deploy to staging (only on develop branch pushes)
  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Notification
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Frontend: Netlify will auto-deploy from develop branch"
          echo "Backend: Render will auto-deploy from develop branch"

      # Wait for deployments
      - name: Wait for Deployment
        run: sleep 90

      - name: Staging Smoke Test
        run: |
          # Test API health endpoint
          curl -f https://timesheet-api-staging.onrender.com/health || echo "⚠️ API health check failed"
          echo "✅ Staging deployment process completed"

  # Run E2E tests after staging deployment
  e2e-tests:
    name: End-to-End Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress
        run: npm install cypress --save-dev

      - name: Run E2E Tests
        run: npx cypress run --config baseUrl=https://develop--timesheet-app-avrvenkatesa.netlify.app || echo "E2E tests completed"
        env:
          CYPRESS_API_URL: https://timesheet-api-staging.onrender.com

      - name: Upload E2E Screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots