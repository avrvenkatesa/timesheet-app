# render.yaml - Place in repository root
services:
  # Staging Backend API (Free)
  - type: web
    name: timesheet-api-staging
    env: node
    plan: free
    branch: develop
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://develop--avrtimesheet.netlify.app
    healthCheckPath: /health

  # Production Backend API (Optional - $7/month)
  - type: web
    name: timesheet-api
    env: node
    plan: starter
    branch: main
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://avrtimesheet.netlify.app
    healthCheckPath: /health

databases:
  # Staging Database (Free)
  - name: timesheet-db-staging
    plan: free
    databaseName: timesheet_staging
    user: staging_user

  # Production Database (Optional - $7/month)
  - name: timesheet-db
    plan: starter
    databaseName: timesheet_production
    user: prod_user